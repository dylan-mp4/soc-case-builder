name: Build Executable

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache virtual environment
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-venv-${{ hashFiles('dev_requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-venv-

      - name: Set up or reuse virtual environment
        shell: pwsh
        run: |
          if (!(Test-Path ".venv")) {
            python -m venv .venv
          }
          .venv\Scripts\pip install --upgrade pip
          .venv\Scripts\pip install -r dev_requirements.txt

      - name: Verify PyQt6 installation
        shell: pwsh
        run: |
          Write-Host "Verifying installed packages..."
          .venv\Scripts\pip list | Select-String -Pattern "PyQt6|pyinstaller"
          Write-Host "`nTesting PyQt6 import..."
          .venv\Scripts\python -c "import PyQt6; print('PyQt6 imported successfully'); print('PyQt6 location:', PyQt6.__file__)"
          Write-Host "`nPython site-packages location..."
          .venv\Scripts\python -c "import site; print(site.getsitepackages())"
          Write-Host "`nPyInstaller location..."
          .venv\Scripts\python -c "import PyInstaller; print('PyInstaller location:', PyInstaller.__file__)"

      - name: Extract version from version.py
        id: get_version
        shell: pwsh
        run: |
          $version = Select-String -Path src/resources/version.py -Pattern '__version__\s*=\s*"(.*)"' | ForEach-Object { $_.Matches[0].Groups[1].Value }
          echo "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build soc_case_builder.exe with PyInstaller
        shell: pwsh
        run: |
          Write-Host "Building with PyInstaller..."
          Write-Host "Python executable: $(.venv\Scripts\python -c 'import sys; print(sys.executable)')"
          .venv\Scripts\python -m PyInstaller --clean soc_case_builder.spec

      - name: Verify build output
        shell: pwsh
        run: |
          Write-Host "Checking dist/soc_case_builder contents..."
          Get-ChildItem -Path dist/soc_case_builder -Name
          Write-Host "`nChecking dist/soc_case_builder/_internal contents (first 30)..."
          if (Test-Path "dist/soc_case_builder/_internal") {
            Get-ChildItem -Path dist/soc_case_builder/_internal -Name | Select-Object -First 30
          } else {
            Write-Host "_internal folder not found!"
          }
          Write-Host "`nChecking for PyQt6..."
          if (Test-Path "dist/soc_case_builder/_internal/PyQt6") {
            Write-Host "PyQt6 folder exists"
          } else {
            Write-Host "PyQt6 folder NOT found!"
          }

      - name: Build updater.exe with PyInstaller
        run: |
          .venv\Scripts\pyinstaller updater.spec

      - name: Copy updater.exe to dist/soc_case_builder
        run: |
          Copy-Item -Path dist\updater\updater.exe -Destination dist\soc_case_builder\updater.exe

      - name: Zip the executable and updater
        run: |
          powershell Compress-Archive -Path dist/soc_case_builder -DestinationPath dist/soc_case_builder.zip

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.VERSION }}
          release_name: Release v${{ env.VERSION }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/soc_case_builder.zip
          asset_name: soc_case_builder.zip
          asset_content_type: application/zip
